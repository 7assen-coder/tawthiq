[package]
name = "tawthiq"
version = "1.2.0"
description = "Hospital CNAM/OLIVEX Reconciliation App"
authors = ["Tawthiq"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/7assen-coder/tawthiq"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tawthiq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
calamine = "0.26"
bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rust_xlsxwriter = "0.79"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
base64 = "0.22"
whoami = "1.5"
