name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (e.g. v1.1.0)
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-latest
            args: --bundles app,dmg
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux WebKit / GTK deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: |
          npm -v
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Tawthiq ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Desktop installers for Windows (NSIS `.exe`), macOS (`.dmg` / `.app`), and Linux (`.deb` / `.AppImage`).
            Also download `Tawthiq-${{ github.event.inputs.tag || github.ref_name }}-all-os.zip` when the package job finishes (partial OS sets are OK if one platform flakes).
            Hospital SOP: docs/IT.md. Unsigned macOS builds: right-click → Open (Gatekeeper). Windows may show SmartScreen on first run.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

  package-all-os:
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Zip per-OS installers onto the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p all-os/{windows,macos,linux,updater} all-os-raw
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir all-os-raw; then
            echo "No release assets yet for $TAG"
            exit 1
          fi
          shopt -s nullglob
          cd all-os-raw
          for f in *.exe *.nsis.zip *.msi; do
            [[ -e "$f" ]] && mv "$f" ../all-os/windows/
          done
          for f in *.dmg *.app.tar.gz; do
            [[ -e "$f" ]] && mv "$f" ../all-os/macos/
          done
          for f in *.deb *.AppImage *.rpm; do
            [[ -e "$f" ]] && mv "$f" ../all-os/linux/
          done
          for f in latest.json *.sig *.app.tar.gz.sig; do
            [[ -e "$f" ]] && mv "$f" ../all-os/updater/ || true
          done
          for f in *; do
            [[ -f "$f" ]] && mv "$f" ../all-os/updater/
          done
          cd ..
          BIN_COUNT=$(find all-os/windows all-os/macos all-os/linux -type f 2>/dev/null | wc -l | tr -d ' ')
          if [[ "$BIN_COUNT" -eq 0 ]]; then
            echo "No installer binaries found — aborting zip"
            exit 1
          fi
          echo "Packaging $BIN_COUNT installer file(s)"
          find all-os -type f -print0 | sort -z | xargs -0 sha256sum > all-os/SHA256SUMS.txt
          zip -r "Tawthiq-${TAG}-all-os.zip" all-os
          gh release upload "$TAG" "Tawthiq-${TAG}-all-os.zip" --repo "$GITHUB_REPOSITORY" --clobber
